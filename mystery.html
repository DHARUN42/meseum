<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystery box</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
      <main class="main">
        
        <div class="back-div">
        <a href="index.html#mystery" class="back-link">
            ← Back to Mystery Boxes
        </a>
        </div>

        <section class="mystery-detail">

            <div class="mystery-image">
                <img id="mystery-image" src="" alt="">
            </div>

            <div class="mystery-info">

                <h1  id="mystery-name"></h1>

                <span id="mystery-risk"></span>

                

                <p class="mystery-p"><b class="b">Found</b> <span id="mystery-found"></span></p>

                <p class="mystery-p"><b class="b">Discovered</b> <span id="mystery-date"></span></p>

                <p class="mystery-p"><b class="b">Owner</b> <span id="mystery-owner"></span></p>

                <p class="mystery-p"><b class="b">Estimated Age</b> <span id="mystery-age"></span></p>

                <p class="mystery-p"><b class="b">Contents</b> <span id="mystery-contents"></span></p>

                

            </div>

        </section>

        <section class="archive-notes">

            <h2>Mystery Notes</h2>

            <p id="mystery-notes"></p>

        </section>

        <div class="do-not-open">

            <h2>⚠️ DO NOT CONSUME</h2>

            <p>For your safety and everyone else's.</p>

        </div>

    </main>

    <script src="script.js"></script>
    
</body>
</html>
